<text x="40" y="52" font-family="Lora, Georgia, serif" font-size="30" fill="#2a2626">ER additions · migration 007 (v1.6)</text>
<text x="40" y="80" font-size="15" fill="#7d736f">Loans and care jobs are history tables kept in step with the status by Availability.setStatus. At most ONE open loan and ONE open care job per piece (partial unique indexes).</text>
