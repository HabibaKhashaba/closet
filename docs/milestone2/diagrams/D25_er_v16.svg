<text x="1092" y="430.6" text-anchor="start" font-size="13" font-weight="normal" fill="#4a4342">converted by 007:</text>
<text x="1092" y="452.6" text-anchor="start" font-size="13" font-weight="normal" fill="#4a4342">each row → status Ready to donate</text>
<text x="1092" y="474.6" text-anchor="start" font-size="13" font-weight="normal" fill="#4a4342">then DROP TABLE</text>
