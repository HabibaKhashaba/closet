<text x="60" y="424.4" text-anchor="start" font-size="12.5" font-weight="normal" fill="#7d736f">Outcome of a care job: collected · fixed · donated</text>
<text x="60" y="448.4" text-anchor="start" font-size="12.5" font-weight="normal" fill="#7d736f">Borrowed rows without a loan were back-filled into loans.</text>
<rect x="60" y="680" width="1460" height="90" rx="12" fill="#fff7f4" stroke="#c48a86" stroke-width="1.2" opacity="1"/>
<text x="76" y="708.9" text-anchor="start" font-size="14" font-weight="700" fill="#9c5f5b">Design decision (SDD v1.3, R5.2) — reverses v1.5 “rehoming is not a status”</text>
<text x="76" y="734.5" text-anchor="start" font-size="13" font-weight="normal" fill="#2a2626">Two sources of truth (a status + a separate rehoming row) made screens disagree. v1.6 has ONE lifecycle: Ready to donate is a state like Laundry,</text>
<text x="76" y="756.5" text-anchor="start" font-size="13" font-weight="normal" fill="#2a2626">so every module asks the same helpers (isWearable, isOwned, isLeaving). Leaving the closet is still a delete with a reason, never a state.</text>
