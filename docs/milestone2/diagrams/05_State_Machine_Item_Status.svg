<text x="1096" y="669.2" text-anchor="start" font-size="15" font-weight="700" fill="#9c5f5b">Rules</text>
<text x="1096" y="698.7" text-anchor="start" font-size="13.5" font-weight="normal" fill="#2a2626">A piece in the laundry cannot be lent or packed.</text>
<text x="1096" y="726.7" text-anchor="start" font-size="13.5" font-weight="normal" fill="#2a2626">Borrowed / Packed may return straight to Laundry.</text>
<text x="1096" y="754.7" text-anchor="start" font-size="13.5" font-weight="normal" fill="#2a2626">Every move writes availability.status_history.</text>
<text x="1096" y="782.7" text-anchor="start" font-size="13.5" font-weight="normal" fill="#2a2626">A planned piece that is away → conflict (US-79).</text>
<text x="1096" y="810.7" text-anchor="start" font-size="13.5" font-weight="normal" fill="#2a2626">Tests: ST-01 – ST-04, API-S01 – S06, API-L01 – L03, AT-10 – AT-12.</text>
