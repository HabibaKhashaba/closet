<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, Helvetica, Arial, sans-serif">
<defs><marker id="arr" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#2a2626"/></marker><marker id="open" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10" fill="none" stroke="#2a2626" stroke-width="1.5"/></marker><marker id="tri" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L15,7 L0,14 z" fill="#fff" stroke="#2a2626" stroke-width="1.4"/></marker><marker id="dia" markerWidth="18" markerHeight="12" refX="1" refY="6" orient="auto"><path d="M1,6 L9,1 L17,6 L9,11 z" fill="#2a2626"/></marker><marker id="arrR" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#9c5f5b"/></marker></defs>
<rect width="1600" height="900" fill="#fffdfb"/>
<text x="40" y="52" font-family="Lora, Georgia, serif" font-size="30" fill="#2a2626">Deployment and testing architecture</text>
<text x="40" y="80" font-size="15" fill="#7d736f">One deployable (Node.js serves the API and the built React app), one database, CI on every pull request.</text>
<rect x="60" y="130" width="330" height="180" rx="14" fill="#fbeef0" stroke="#c48a86" stroke-width="1.6" opacity="1"/>
<text x="225" y="165.2" text-anchor="middle" font-size="15" font-weight="700" fill="#2a2626">«device» Phone / laptop browser</text>
<text x="225" y="215.6" text-anchor="middle" font-size="16" font-weight="normal" fill="#2a2626">React 19 SPA</text>
<text x="225" y="244.6" text-anchor="middle" font-size="13" font-weight="normal" fill="#7d736f">session token in sessionStorage</text>
<rect x="520" y="110" width="520" height="330" rx="14" fill="#fff" stroke="#2a2626" stroke-width="1.6" opacity="1"/>
<text x="780" y="145.2" text-anchor="middle" font-size="15" font-weight="700" fill="#2a2626">«node» Render web service · Node 22</text>
<rect x="550" y="170" width="460" height="70" rx="10" fill="#e4f0e8" stroke="#4f8a66" stroke-width="1.4" opacity="1"/>
<text x="780" y="210.2" text-anchor="middle" font-size="15" font-weight="normal" fill="#2a2626">Express API · /api/v1 · security pipeline</text>
<rect x="550" y="255" width="460" height="70" rx="10" fill="#f8ecdc" stroke="#b77a33" stroke-width="1.4" opacity="1"/>
<text x="780" y="295.2" text-anchor="middle" font-size="15" font-weight="normal" fill="#2a2626">Static web app (client/dist)</text>
<rect x="550" y="340" width="460" height="70" rx="10" fill="#eee7f2" stroke="#7a5a9c" stroke-width="1.4" opacity="1"/>
<text x="780" y="379.9" text-anchor="middle" font-size="14" font-weight="normal" fill="#2a2626">Env secrets: JWT, DB URL, LLM key, photo secret</text>
<rect x="1160" y="130" width="380" height="150" rx="14" fill="#e8f4ec" stroke="#2a2626" stroke-width="1.6" opacity="1"/>
<text x="1350" y="170.2" text-anchor="middle" font-size="15" font-weight="700" fill="#2a2626">«database» PostgreSQL 16</text>
<text x="1350" y="214.9" text-anchor="middle" font-size="14" font-weight="normal" fill="#2a2626">11 schemas · migrations 001–005</text>
<text x="1350" y="244.6" text-anchor="middle" font-size="13" font-weight="normal" fill="#7d736f">seed: npm run seed (demo reset)</text>
<rect x="1160" y="310" width="380" height="110" rx="14" fill="#f4f1ee" stroke="#8f857c" stroke-width="1.4" opacity="1"/>
