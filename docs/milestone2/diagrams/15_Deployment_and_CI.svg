<text x="708" y="598.1" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2626">API tests</text>
<text x="708" y="616.4" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2626">(Supertest)</text>
<line x1="794.0" y1="602.0" x2="810.0" y2="602.0" stroke="#2a2626" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="812" y="560" width="168" height="84" rx="12" fill="#e4f0e8" stroke="#2a2626" stroke-width="1.4" opacity="1"/>
