<text x="1084" y="616.4" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2626">report</text>
<line x1="1170.0" y1="602.0" x2="1186.0" y2="602.0" stroke="#2a2626" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="1188" y="560" width="168" height="84" rx="12" fill="#fff" stroke="#2a2626" stroke-width="1.4" opacity="1"/>
<text x="1272" y="598.1" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2626">build web app</text>
<text x="1272" y="616.4" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2626">+ seed demo</text>
<line x1="1358.0" y1="602.0" x2="1374.0" y2="602.0" stroke="#2a2626" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="1376" y="560" width="168" height="84" rx="12" fill="#f8ecdc" stroke="#2a2626" stroke-width="1.4" stroke-dasharray="6 4" opacity="1"/>
<text x="1460" y="598.1" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2626">browser journey</text>
<text x="1460" y="616.4" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2626">(Playwright)</text>
<text x="60" y="705.2" text-anchor="start" font-size="15" font-weight="normal" fill="#2a2626">Jobs: server (unit, API, acceptance, coverage) · client (build) · e2e (the live-demo route in Chromium, screenshot per step, fails on any browser error).</text>
<text x="60" y="734.9" text-anchor="start" font-size="14" font-weight="normal" fill="#7d736f">The e2e job (dashed) was added in the final pass; it has been run locally (evidence in the test report) and runs in CI from the next push.</text>
