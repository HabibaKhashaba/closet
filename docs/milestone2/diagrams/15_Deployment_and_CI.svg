<rect x="1067.0" y="180.6" width="66.0" height="18.8" rx="4" fill="#fffdfb"/>
<text x="1100" y="194.4" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#7d736f">pg (TLS)</text>
<line x1="1040.0" y1="365.0" x2="1158.0" y2="365.0" stroke="#8f857c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#open)"/>
<text x="60" y="524.9" text-anchor="start" font-size="14" font-weight="700" fill="#9c5f5b">CONTINUOUS INTEGRATION · GitHub Actions on every pull request</text>
