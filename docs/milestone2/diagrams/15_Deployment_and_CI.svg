<text x="1350" y="379.6" text-anchor="middle" font-size="13" font-weight="normal" fill="#7d736f">calendar .ics · photo store</text>
<line x1="392.0" y1="220.0" x2="518.0" y2="220.0" stroke="#2a2626" stroke-width="1.6" marker-end="url(#arr)"/>
