<text x="40" y="52" font-family="Lora, Georgia, serif" font-size="30" fill="#2a2626">State machine · one garment lifecycle (v1.6)</text>
<text x="40" y="80" font-size="15" fill="#7d736f">Exactly one of 9 states per piece, 21 allowed moves (shared/lifecycle.js). Every status change goes through Availability.setStatus, which also opens / closes loans and care jobs.</text>
