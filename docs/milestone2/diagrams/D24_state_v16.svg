<text x="1306" y="330.4" text-anchor="start" font-size="12.5" font-weight="700" fill="#9c5f5b">WHAT EACH STATE MEANS</text>
<text x="1306" y="356.4" text-anchor="start" font-size="12.5" font-weight="normal" fill="#2a2626">Only Available is wearable</text>
<text x="1306" y="379.4" text-anchor="start" font-size="12.5" font-weight="normal" fill="#2a2626">   (Style me, plans, trips).</text>
<text x="1306" y="402.4" text-anchor="start" font-size="12.5" font-weight="normal" fill="#2a2626">Care screen: Laundry, Needs repair,</text>
<text x="1306" y="425.4" text-anchor="start" font-size="12.5" font-weight="normal" fill="#2a2626">   Needs alteration, At tailor.</text>
<text x="1306" y="448.4" text-anchor="start" font-size="12.5" font-weight="normal" fill="#2a2626">Borrowed: an open loan</text>
<text x="1306" y="471.4" text-anchor="start" font-size="12.5" font-weight="normal" fill="#2a2626">   (person, lent, due).</text>
<text x="1306" y="494.4" text-anchor="start" font-size="12.5" font-weight="normal" fill="#2a2626">At tailor: an open care job (tailor,</text>
<text x="1306" y="517.4" text-anchor="start" font-size="12.5" font-weight="normal" fill="#2a2626">   sent, expected back, cost) →</text>
<text x="1306" y="540.4" text-anchor="start" font-size="12.5" font-weight="normal" fill="#2a2626">   reminder on the day.</text>
<text x="1306" y="563.4" text-anchor="start" font-size="12.5" font-weight="normal" fill="#2a2626">Ready to donate: still owned, left</text>
<text x="1306" y="586.4" text-anchor="start" font-size="12.5" font-weight="normal" fill="#2a2626">   out of outfits, duplicates, gaps.</text>
<text x="1306" y="609.4" text-anchor="start" font-size="12.5" font-weight="normal" fill="#2a2626">Donated is not a state: archived</text>
<text x="1306" y="632.4" text-anchor="start" font-size="12.5" font-weight="normal" fill="#2a2626">   with reason Donated, history kept,</text>
<text x="1306" y="655.4" text-anchor="start" font-size="12.5" font-weight="normal" fill="#2a2626">   no replacement (BR-12).</text>
<text x="1435" y="734.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#7d736f">81 ordered pairs tested (ST-01 – ST-06):</text>
<text x="1435" y="754.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#7d736f">21 valid, 60 rejected with 409.</text>
