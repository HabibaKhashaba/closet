<text x="420" y="304.4" text-anchor="start" font-size="12.5" font-weight="normal" fill="#7d736f">Mark as donated → row moves to deletions</text>
<rect x="60" y="760" width="860" height="100" rx="12" fill="#fff7f4" stroke="#c48a86" stroke-width="1.2" opacity="1"/>
<text x="76" y="788.9" text-anchor="start" font-size="14" font-weight="700" fill="#9c5f5b">Design decision (SDD 5.15)</text>
<text x="76" y="814.5" text-anchor="start" font-size="13" font-weight="normal" fill="#2a2626">Donation is a separate lifecycle, not a 6th item status: the 5-status state machine and its 25 tested</text>
<text x="76" y="836.5" text-anchor="start" font-size="13" font-weight="normal" fill="#2a2626">transitions stay unchanged; a piece “Ready to donate” is still owned, so its status stays truthful.</text>
