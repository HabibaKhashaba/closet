<rect width="1600" height="900" fill="#fffdfb"/>
<text x="40" y="52" font-family="Lora, Georgia, serif" font-size="30" fill="#2a2626">ER additions · migration 006 (v1.5)</text>
<text x="40" y="80" font-size="15" fill="#7d736f">Only the data the features need. Days since worn, cost per wear, seasons, laundry risk and conflicts are DERIVED at read time — no second copy of any status.</text>
