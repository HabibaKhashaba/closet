<text x="72" y="180.6" text-anchor="start" font-size="13" font-weight="600" fill="#2a2626">PK id</text>
<text x="72" y="202.6" text-anchor="start" font-size="13" font-weight="600" fill="#2a2626">FK user_id</text>
<text x="72" y="224.6" text-anchor="start" font-size="13" font-weight="normal" fill="#4a4342">category · colour · season …</text>
<text x="72" y="246.6" text-anchor="start" font-size="13" font-weight="normal" fill="#4a4342">wear_count · last_worn_at</text>
<text x="72" y="268.6" text-anchor="start" font-size="13" font-weight="normal" fill="#9c5f5b">+ price NUMERIC(10,2) NULL</text>
<text x="72" y="290.6" text-anchor="start" font-size="13" font-weight="normal" fill="#9c5f5b">+ currency EGP|USD|EUR|…</text>
<text x="72" y="312.6" text-anchor="start" font-size="13" font-weight="normal" fill="#9c5f5b">+ purchase_date DATE</text>
