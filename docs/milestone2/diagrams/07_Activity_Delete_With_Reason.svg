<text x="60" y="778.7" text-anchor="start" font-size="13.5" font-weight="normal" fill="#2a2626">FR-15 a deletion reason is required (4 values) · FR-71 reasons update shopping and personalisation (BR-10)</text>
<text x="60" y="803.7" text-anchor="start" font-size="13.5" font-weight="normal" fill="#2a2626">FR-72 replacement for Torn / damaged, next size for Became too small · FR-58 never treat “No longer my style” as a replacement</text>
