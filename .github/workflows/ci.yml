# Runs every test on every pull request and on main (NFR-09, process requirement PR-04).
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: closet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/closet_test
      JWT_SECRET: ci-secret
      PHOTO_URL_SECRET: ci-photo-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run coverage
      - uses: actions/upload-artifact@v4
        with: { name: coverage-report, path: server/coverage }

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build

  # The browser journey (e2e/demo_journey.py): the whole live-demo route in Chromium, failing on any
  # browser error. Added in the final pass of Milestone 2.
  e2e:
    runs-on: ubuntu-latest
    needs: [server, client]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: closet
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/closet
      JWT_SECRET: ci-secret
      PHOTO_URL_SECRET: ci-photo-secret
      CLIENT_ORIGIN: http://localhost:4000
      PHOTO_DIR: /tmp/closet-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm install && npm run build
        working-directory: client
      - run: npm install && npm run migrate && npm run seed
        working-directory: server
      - run: (WEATHER_MODE=estimate npm start > /tmp/server.log 2>&1 &) && npx --yes wait-on http://localhost:4000/api/v1/health
        working-directory: server
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: set -o pipefail; SHOTS=e2e-shots/ python e2e/demo_journey.py | tee e2e-result.txt
      - run: set -o pipefail; npm run seed && SHOTS=e2e-stateful/ python e2e/stateful_journey.py | tee -a e2e-result.txt
        working-directory: .
      - run: set -o pipefail; node server/scripts/demo-check.js | tee -a e2e-result.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-journey
          path: |
            e2e-shots/
            e2e-stateful/
            e2e-result.txt

  # The offline demo (one HTML file, no server) must behave like the live app: same stateful journey.
  offline-demo:
    runs-on: ubuntu-latest
    needs: [client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm install && npm run build
        working-directory: client
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: bash tools/offline_demo/build.sh "$PWD/Closet_Demo.html"
      - run: set -o pipefail; CLOSET_URL="file://$PWD/Closet_Demo.html" SHOTS=offline-shots/ python e2e/stateful_journey.py | tee offline-result.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-demo
          path: |
            Closet_Demo.html
            offline-shots/
            offline-result.txt
