# Local PostgreSQL for development and tests:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: closet
    ports: ['5432:5432']
    volumes:
      - closet-db:/var/lib/postgresql/data
      - ./server/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql
volumes:
  closet-db:
